# Cloudflare Workers configuration for Rodemap (Worker with static assets).
# `npx wrangler deploy` runs `npm run build` ([build]), uploads dist/ as static assets and deploys
# worker/index.ts, which only handles /api/* (Mochi). Everything else is served from dist/.
# Secret (set under the Worker's Settings → Variables and Secrets, or with `npx wrangler secret put ANTHROPIC_API_KEY`):
#   ANTHROPIC_API_KEY — without it Mochi runs in offline mode.
name = "rodemap"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
MOCHI_MODEL = "claude-opus-5-5"
MOCHI_EFFORT = "low"

# Optional: durable rate limits across isolates. Create a KV namespace, then uncomment.
# [[kv_namespaces]]
# binding = "MOCHI_RATE_LIMIT"
# id = "<kv-namespace-id>"
